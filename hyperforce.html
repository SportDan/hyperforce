<html lang="ru">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HyperForce">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="description" content="4-недельный мезоцикл: гипертрофия + сила + кондиция">
    <title>HyperForce</title>

    <link rel="apple-touch-icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'>
        <rect width='180' height='180' rx='36' fill='%230b0b0b'/>

    </svg>">

    <style>
        :root {
            --bg: #0b0b0b;
            --surface: #181818;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-secondary: #9a9a9a;
            --accent: #c9a24d;
            --accent-glow: rgba(201, 162, 77, 0.25);
            --green: #4caf84;
            --red: #e0556a;
            --orange: #d68f4e;
            --blue: #5a9fd4;
            --radius: 14px;
            --radius-sm: 10px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --safe-left: env(safe-area-inset-left, 12px);
            --safe-right: env(safe-area-inset-right, 12px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 8px 4px;
        }
        .header {
            text-align: center;
            margin-bottom: 6px;
            padding-top: 4px;
        }
        .header .logo {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .logo-icon {
            width: 30px;
            height: 30px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #1a1a1a;
            font-weight: 900;
        }
        .header .subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .week-swiper {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .week-swiper::-webkit-scrollbar {
            display: none;
        }
        .week-btn {
            flex: 1 0 auto;
            min-width: 68px;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            font-family: inherit;
            text-align: center;
            line-height: 1.2;
            scroll-snap-align: center;
        }
        .week-btn small {
            display: block;
            font-weight: 400;
            font-size: 0.6rem;
            opacity: 0.7;
            margin-top: 1px;
        }
        .week-btn.active {
            background: var(--accent);
            color: #1a1a1a;
            box-shadow: 0 4px 18px var(--accent-glow);
            transform: scale(1.03);
        }
        .week-btn:active {
            transform: scale(0.95);
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 8px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
        }
        .chip .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .dot-g {
            background: var(--green);
        }
        .dot-o {
            background: var(--orange);
        }
        .dot-r {
            background: var(--red);
        }
        .dot-b {
            background: var(--blue);
        }
        .chip.accent {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(201, 162, 77, 0.08);
        }
        .chip.emom {
            border-color: #5a9fd4;
            color: #5a9fd4;
            background: rgba(90, 159, 212, 0.08);
        }
        .chip.hiit {
            border-color: #e0556a;
            color: #e0556a;
            background: rgba(224, 85, 106, 0.08);
        }
        .day-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 7px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .day-card:active {
            border-color: #3a3a3a;
        }
        .day-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .day-head:active {
            background: rgba(255, 255, 255, 0.03);
        }
        .day-head-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .day-icon-sm {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .ic-gym {
            background: rgba(201, 162, 77, 0.15);
            color: var(--accent);
        }
        .ic-emom {
            background: rgba(90, 159, 212, 0.15);
            color: #7bb3dd;
        }
        .ic-hiit {
            background: rgba(224, 85, 106, 0.15);
            color: #e07282;
        }
        .ic-cardio {
            background: rgba(76, 175, 132, 0.15);
            color: var(--green);
        }
        .ic-rest {
            background: rgba(127, 140, 141, 0.15);
            color: #95a5a6;
        }
        .day-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #f2f2f2;
        }
        .day-sub {
            font-size: 0.66rem;
            color: var(--text-secondary);
        }
        .day-arrow {
            font-size: 0.6rem;
            color: var(--text-secondary);
            transition: transform 0.25s;
        }
        .day-card.open .day-arrow {
            transform: rotate(180deg);
        }
        .day-body {
            display: none;
            padding: 0 12px 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .day-card.open .day-body {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.73rem;
            min-width: 540px;
        }
        th {
            text-align: left;
            font-weight: 600;
            font-size: 0.62rem;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 8px 4px 8px 0;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            white-space: nowrap;
        }
        td {
            padding: 9px 4px 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            vertical-align: middle;
            color: #d0d0d0;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .ex-name {
            font-weight: 500;
            color: #f2f2f2;
            white-space: nowrap;
        }
        .ex-accent {
            color: var(--accent) !important;
            font-weight: 700 !important;
        }
        .rir {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 10px;
            letter-spacing: 0.3px;
            min-width: 26px;
            text-align: center;
        }
        .rir0 {
            background: rgba(192, 57, 43, 0.22);
            color: #e0556a;
        }
        .rir1 {
            background: rgba(211, 84, 0, 0.2);
            color: #d68f4e;
        }
        .rir2 {
            background: rgba(108, 142, 191, 0.2);
            color: #7aadd6;
        }
        .rir3 {
            background: rgba(76, 175, 132, 0.2);
            color: #5daa7a;
        }
        .rir4 {
            background: rgba(127, 140, 141, 0.2);
            color: #95a5a6;
        }
        .note {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-style: italic;
            max-width: 140px;
            white-space: normal;
            line-height: 1.4;
        }
        .info-box {
            padding: 10px 0;
            font-size: 0.78rem;
            color: #ccc;
            line-height: 1.7;
        }
        .info-box strong {
            color: #7bb3dd;
        }
        .info-box.hiit-box strong {
            color: #e07282;
        }
        .legend {
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.64rem;
            color: var(--text-secondary);
            align-items: center;
        }
        .legend .rir {
            margin-right: 2px;
        }
        @media (max-width: 380px) {
            .week-btn {
                min-width: 58px;
                padding: 10px 5px;
                font-size: 0.65rem;
            }
            .day-head {
                padding: 12px 10px;
            }
            .day-body {
                padding: 0 8px 8px;
            }
            th,
            td {
                padding: 7px 3px 7px 0;
                font-size: 0.68rem;
            }
        }
    </style>
</head>

            };

            const weekContent = document.getElementById('weekContent');
            const weekSwiper = document.getElementById('weekSwiper');
            const weekBtns = weekSwiper.querySelectorAll('.week-btn');

            function renderWeek(weekNum) {
                const data = program[weekNum];
                let chipsHTML = data.chips.map(c =>
                    `<span class="chip${c.cls ? ' ' + c.cls : ''}">${c.cls.startsWith('dot') ? '<span class="dot ' + c.cls + '"></span>' : ''}${c.text}</span>`
                ).join('');

                let daysHTML = data.days.map(d => {
                    let bodyHTML = '';
                    if (d.type === 'table') {
                        bodyHTML = `<table><thead><tr><th>№</th><th>Упражнение</th><th>Сеты×Повт</th><th>RIR</th><th>%1ПМ</th><th>Прим.</th></tr></thead><tbody>`;
                        d.rows.forEach(r => {
                            const accentClass = r[8] === 'ex-accent' ? ' ex-accent' : '';
                            bodyHTML +=
                                `<tr><td>${r[0]}</td><td class="ex-name${accentClass}">${r[1]}</td><td>${r[2]}</td><td><span class="rir ${r[3]}">${r[4]}</span></td><td>${r[5]}</td><td class="note">${r[6] || ''}</td></tr>`;
                        });
                        bodyHTML += `</tbody></table>`;
                    } else {
                        const boxClass = d.icon === 'ic-hiit' ? ' hiit-box' : '';
                        bodyHTML = `<div class="info-box${boxClass}">${d.text}</div>`;
                    }
                    return `<div class="day-card open"><div class="day-head" onclick="this.parentElement.classList.toggle('open')"><div class="day-head-left"><div class="day-icon-sm ${d.icon}">${d.day}</div><div><div class="day-title">${d.title}</div><div class="day-sub">${d.sub}</div></div></div><span class="day-arrow">▼</span></div><div class="day-body">${bodyHTML}</div></div>`;
                }).join('');

                weekContent.innerHTML = `
                    <div class="chip-row">${chipsHTML}</div>
                    ${daysHTML}
                `;
            }

            function setActiveWeek(weekNum) {
                weekBtns.forEach(b => b.classList.remove('active'));
                const activeBtn = weekSwiper.querySelector(`[data-week="${weekNum}"]`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
                renderWeek(weekNum);
            }

            weekSwiper.addEventListener('click', function(e) {
                const btn = e.target.closest('.week-btn');
                if (!btn) return;
                setActiveWeek(btn.getAttribute('data-week'));
            });

            // Свайп на неделях
            let touchStartX = 0;
            weekContent.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            weekContent.addEventListener('touchend', function(e) {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) < 50) return;
                const active = weekSwiper.querySelector('.week-btn.active');
                if (!active) return;
                const cur = parseInt(active.getAttribute('data-week'));
                let next = cur;
                if (diff > 0 && cur < 4) next = cur + 1;
                if (diff < 0 && cur > 1) next = cur - 1;
                if (next !== cur) setActiveWeek(next);
            });

            // Старт
            renderWeek(1);
        })();
    </script>
